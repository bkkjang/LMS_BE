# ============================================================================
#  테스트 전용 환경설정 (H2 인메모리)
#  test 클래스패스에 있어서, 테스트 실행 시 메인 application.yml 보다 우선 적용됩니다.
#
#  [왜 테스트는 H2를 쓰나]
#   - 빠름: 메모리에서 돌아 디스크 I/O가 없음 → 테스트가 순식간에 끝남
#   - 격리: 매 실행마다 빈 DB로 시작(create-drop) → 테스트끼리 데이터가 섞이지 않음
#   - 무설치: 별도 DB 서버를 띄울 필요 없이 어디서나(CI 포함) 바로 실행 가능
#  운영과 다른 DB로 테스트하는 약점은 MODE=PostgreSQL 로 문법 차이를 최대한 줄여 보완합니다.
# ============================================================================
spring:
  datasource:
    # MODE=PostgreSQL : H2가 PostgreSQL 문법을 흉내내게 해, 운영(Postgres)과의 차이를 줄임
    # DB_CLOSE_DELAY=-1 : 테스트 도중 커넥션이 잠시 비어도 인메모리 DB가 사라지지 않게 유지
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop   # 테스트 시작 시 스키마 생성, 끝나면 삭제(항상 깨끗한 상태)
    show-sql: true
