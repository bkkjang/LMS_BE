# ============================================================================
#  메인 환경설정 — 개발/운영 실행용 (PostgreSQL)
#  테스트 실행 시에는 src/test/resources/application.yml 이 이 파일을 덮어써서 H2를 씁니다.
# ============================================================================
spring:
  application:
    name: bookapp

  # ── 데이터베이스: PostgreSQL ──
  datasource:
    url: jdbc:postgresql://localhost:5432/bookapp   # 로컬 Postgres 의 bookapp DB
    # ${환경변수:기본값} — 배포 시 코드 수정 없이 환경변수만 주입하면 됨(자격증명을 코드에 박지 않는 정석)
    username: ${DB_USERNAME:kim-yeonju}             # Homebrew 로컬 Postgres 는 OS 계정명이 곧 DB 사용자
    password: ${DB_PASSWORD:}                       # 로컬 trust 인증이라 비밀번호 없음(기본값 빈 문자열)
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # update: 엔티티를 보고 없는 테이블/컬럼을 자동 생성·추가(개발 편의).
      #   PostgreSQL 은 영구 저장이라, H2(인메모리)와 달리 재시작해도 데이터가 남습니다.
      #   (운영 환경에서는 none + Flyway 같은 마이그레이션 도구로 스키마를 관리하는 것이 정석.)
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true   # 로그의 SQL 을 보기 좋게 정렬
    show-sql: true         # 실행되는 SQL 을 콘솔에 출력(학습/디버깅에 유용)

server:
  port: 8080
