spring:
  application:
    name: bookapp

  datasource:
    # k8s 배포 시에는 backend-configmap 의 SPRING_DATASOURCE_URL / _USERNAME 이 우선 적용됩니다.
    url: ${DB_URL:jdbc:mysql://localhost:3306/bookdb?createDatabaseIfNotExist=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    # 로컬 개발용 기본값. 운영에서는 SPRING_DATASOURCE_PASSWORD(k8s Secret)로 덮어씁니다.
    password: ${DB_PASSWORD:aivle}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    # Gmail 계정과 앱 비밀번호. 기본값 없음 — 미설정 시 기동 실패합니다.
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  cache:
    type: simple  # 인메모리 캐시 (ConcurrentHashMap) — 추가 의존성 없이 @Cacheable 동작

  sql:
    init:
      mode: never
      encoding: UTF-8

jwt:
  # 토큰 서명 키. 유출되면 임의 사용자로 토큰 위조가 가능하므로 반드시 환경변수로 주입합니다.
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

naver:
  client-id: ${NAVER_CLIENT_ID}
  client-secret: ${NAVER_CLIENT_SECRET}

# OpenAI 프록시용 키 — 환경변수 OPENAI_API_KEY 로 주입(없으면 빈 값).
openai:
  api-key: ${OPENAI_API_KEY:}

server:
  port: ${SERVER_PORT:8080}
