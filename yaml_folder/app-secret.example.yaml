# 애플리케이션 시크릿 템플릿.
#
# 실제 값이 담긴 파일은 절대 커밋하지 마십시오.
# 이 파일을 복사해 값을 채운 뒤 클러스터에 직접 적용합니다.
#
#   cp yaml_folder/app-secret.example.yaml /tmp/app-secret.yaml
#   # /tmp/app-secret.yaml 값 채우기
#   kubectl apply -f /tmp/app-secret.yaml
#   rm /tmp/app-secret.yaml
#
# backend-deployment.yaml 이 이 Secret(app-secret)을 참조하므로,
# 적용하지 않으면 backend 파드가 기동에 실패합니다. (의도된 fail-fast)
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: library
type: Opaque
stringData:
  MAIL_USERNAME: ""
  MAIL_PASSWORD: ""
  JWT_SECRET: ""
  NAVER_CLIENT_ID: ""
  NAVER_CLIENT_SECRET: ""
