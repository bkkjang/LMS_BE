# 백엔드(Spring Boot) 설정 - 비밀번호 제외
# 이 앱은 spring.datasource.* 를 환경변수 SPRING_DATASOURCE_* 로 덮어씀(relaxed binding).
# DB 호스트는 MySQL Service 이름(mysql) → jdbc:mysql://mysql:3306/...
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: library
data:
  SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/bookdb?createDatabaseIfNotExist=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul"
  SPRING_DATASOURCE_USERNAME: "root"
