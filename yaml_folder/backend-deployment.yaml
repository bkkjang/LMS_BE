# 백엔드(Spring Boot, LMS_BE) - Deployment
# replicas: 2 + RollingUpdate (무중단)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: library
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          # 태그는 buildspec.yml의 sed 치환으로 빌드 시점에 자동 주입됨 (수동 수정 불필요)
          image: 416225317325.dkr.ecr.ap-southeast-2.amazonaws.com/lms-be:IMAGE_PLACEHOLDER
          ports:
            - containerPort: 8080
          # DB 접속정보(URL, USERNAME)는 ConfigMap에서 주입
          envFrom:
            - configMapRef:
                name: backend-config
          # DB 비밀번호만 Secret에서 주입 (DB와 같은 Secret 공유)
          env:
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: MYSQL_ROOT_PASSWORD
          # 오토스케일(HPA)이 CPU 기준으로 동작하려면 requests 명시 필수
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
